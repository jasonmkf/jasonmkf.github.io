<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background elements -->
  <circle cx="400" cy="300" r="250" fill="#f3e8ff" opacity="0.5" />
  <circle cx="550" cy="200" r="100" fill="#e9d5ff" opacity="0.7" />
  
  <!-- Smartphone outline -->
  <rect x="300" y="100" width="200" height="400" rx="20" fill="#ffffff" stroke="#6a1b9a" stroke-width="8" />
  <rect x="320" y="140" width="160" height="300" rx="5" fill="#f5f0ff" stroke="#6a1b9a" stroke-width="2" />
  
  <!-- App icons -->
  <rect x="340" y="160" width="50" height="50" rx="10" fill="#9c4dcc" />
  <rect x="410" y="160" width="50" height="50" rx="10" fill="#6a1b9a" />
  <rect x="340" y="230" width="50" height="50" rx="10" fill="#38006b" />
  <rect x="410" y="230" width="50" height="50" rx="10" fill="#9c4dcc" />
  
  <!-- Calendar elements -->
  <rect x="340" y="300" width="120" height="120" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2" />
  <line x1="340" y1="330" x2="460" y2="330" stroke="#6a1b9a" stroke-width="2" />
  <line x1="370" y1="300" x2="370" y2="420" stroke="#6a1b9a" stroke-width="2" />
  <line x1="400" y1="300" x2="400" y2="420" stroke="#6a1b9a" stroke-width="2" />
  <line x1="430" y1="300" x2="430" y2="420" stroke="#6a1b9a" stroke-width="2" />
  <line x1="340" y1="360" x2="460" y2="360" stroke="#6a1b9a" stroke-width="2" />
  <line x1="340" y1="390" x2="460" y2="390" stroke="#6a1b9a" stroke-width="2" />
  
  <!-- Phone button -->
  <circle cx="400" cy="470" r="15" fill="#e9d5ff" stroke="#6a1b9a" stroke-width="2" />
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="30" fill="#9c4dcc" opacity="0.2" />
  <circle cx="600" cy="450" r="40" fill="#6a1b9a" opacity="0.2" />
  <circle cx="150" cy="400" r="50" fill="#38006b" opacity="0.1" />
</svg> 